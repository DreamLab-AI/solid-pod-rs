# cargo-deny configuration for solid-pod-rs
#
# Licence: solid-pod-rs is AGPL-3.0-only, inherited from the JSS ecosystem
# covenant. The allowlist below permits AGPL-3.0 (the crate itself) plus the
# standard Rust-ecosystem permissive licences its dependencies use. Other
# restrictive / commercial licences remain denied via the "deny-by-default"
# posture: anything not on the allowlist fails the licence check.
#
# Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
# Check all targets we support, including wasm32 for the memory-backend feature.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "wasm32-unknown-unknown" },
]
all-features = true

[output]
feature-depth = 1

# -----------------------------------------------------------------------------
# Advisories (RustSec database)
# -----------------------------------------------------------------------------
[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Deny all advisories by default. Any ignore must carry a rationale as a
# comment above the id. Unmaintained crates are also denied unless explicitly
# ignored.
yanked = "deny"
# Dated, justified exceptions — mirrored in ../../.cargo/audit.toml so both
# gates agree. NO blanket ignores: advisories with an in-semver fix are resolved
# via `cargo update` (anyhow 1.0.103, lru 0.16, crossbeam-epoch 0.9.20,
# quinn-proto 0.11.16). Each entry below has no reachable in-semver fix.
# Reviewed 2026-07-10 — revisit by 2026-10-08.
ignore = [
    # `rsa` 0.9.x Marvin timing sidechannel — no patched release exists. Pulled
    # by `openidconnect` (oidc) + activitypub for RSA signature *verification*
    # (public-key ops); the attack targets private-key decryption timing, which
    # this codebase never performs. Revisit when openidconnect drops `rsa`.
    "RUSTSEC-2023-0071",
    # `rustls-webpki` 0.101.7 name-constraint / CRL-panic advisories. Pinned by
    # rustls 0.21 via aws-smithy-http-client's default TLS connector (aws-sdk-s3),
    # reachable ONLY under the `s3-backend` feature and only against a malicious
    # cert from the operator's own configured S3 endpoint. Fix lives in webpki
    # 0.103, unreachable until the AWS SDK migrates off rustls 0.21.
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    # NOTE: `rustls-pemfile` unmaintained (RUSTSEC-2025-0134) is a transitive
    # DEV-dependency of solid-pod-rs-server and is NOT reachable from this
    # crate's own dependency graph, so cargo-deny (manifest = solid-pod-rs)
    # never encounters it. It is ignored in ../../.cargo/audit.toml instead,
    # where the whole-workspace cargo-audit scan does see it.
]

# -----------------------------------------------------------------------------
# Licences
# -----------------------------------------------------------------------------
[licenses]
version = 2
# Require every dependency to have a recognised licence.
unused-allowed-license = "allow"
confidence-threshold = 0.93
allow = [
    # solid-pod-rs itself
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    # Standard Rust-ecosystem permissive licences used by dependencies
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unlicense",
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    # webpki-roots bundles the Mozilla CA certificate set, licensed under the
    # Linux Foundation's Community Data License Agreement — Permissive 2.0.
    # It is a permissive data licence (use + redistribution granted) and is the
    # standard licence for CA-root data across the rustls ecosystem.
    "CDLA-Permissive-2.0",
]
# AGPL is explicitly allowed (the crate inherits it from JSS). Other
# copyleft / commercial / source-available licences (e.g. BUSL, SSPL,
# Elastic-2.0, commercial-only) remain implicitly denied: anything not on
# the allowlist fails the licence check.
exceptions = []

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

# -----------------------------------------------------------------------------
# Bans
# -----------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal path dependencies (e.g. the `solid-pod-rs-server`
# dev-dependency used for round-trip integration tests) carry no version req
# and would otherwise trip the wildcard ban. Registry wildcards remain denied.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
# Specific crates we never want to pull in.
deny = [
    # openssl — we use rustls everywhere. If this shows up it's a dep regression.
    { name = "openssl" },
    { name = "openssl-sys" },
    # native-tls — same reason; rustls-only policy.
    { name = "native-tls" },
]
# Hyper ecosystem regularly ships multiple versions during migrations. Allow
# duplicates we have audited.
skip = []
skip-tree = []

# -----------------------------------------------------------------------------
# Sources
# -----------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
