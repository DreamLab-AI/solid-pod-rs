[package]
name = "solid-pod-rs-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
rust-version.workspace = true
description = "Drop-in Solid Pod server binary. Wraps solid-pod-rs with actix-web and a JSS-compatible layered config loader."
keywords = ["solid", "pod", "server", "nostr", "agpl"]
categories = ["web-programming::http-server", "command-line-utilities"]
readme = "README.md"

[lib]
name = "solid_pod_rs_server"
path = "src/lib.rs"

[[bin]]
name = "solid-pod-rs-server"
path = "src/main.rs"

[dependencies]
# Library core — the binary's sole non-transport dependency.
# `dpop-replay-cache` is enabled unconditionally so the deployed server
# always has DPoP `jti` replay protection wired into `verify_dpop_proof`
# (Solid-OIDC §5.2 / RFC 9449 §4.3; mirrors JSS 2026-01-05 #2). Without
# it `verify_dpop_proof` compiles to its replay-unaware form.
#
# `mrc20` is enabled unconditionally so the server always carries the
# block-trail anchor verify-side: BIP-341 taproot derivation + the
# `MempoolLookup` trait the native `MempoolHttpClient` (mempool.rs)
# implements for `/pay/.deposit` (MRC20) and `/pay/.address`
# (provenance-upgrade Phase 3).
solid-pod-rs = { version = "0.5.0-alpha.3", path = "../solid-pod-rs", features = ["fs-backend", "memory-backend", "config-loader", "legacy-notifications", "dpop-replay-cache", "embedded-docs", "mrc20"] }

# IdP crate — Sprint-11 CLI ops (`account delete`, `invite create`)
# dispatch into UserStore::delete and the new InviteStore trait.
solid-pod-rs-idp = { version = "0.5.0-alpha.3", path = "../solid-pod-rs-idp" }

# Sprint-11 CLI: `invite create` surfaces invite records with
# absolute expiry timestamps. Kept here rather than transitively
# through solid-pod-rs so the server binary can build invite URLs
# independently.
chrono = { version = "0.4", features = ["clock"] }

# HTTP transport.
actix-web = "4"

# Async runtime.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }

# CLI parsing — clap derive.
clap = { version = "4", features = ["derive", "env"] }

# Request/response helpers.
bytes = "1"

# Constant-time byte comparison for the native-pod provisioning PSK
# (`/_admin/provision`). Prevents a timing side-channel on the admin key.
subtle = "2.6"

# Percent-decoding for the defence-in-depth path-traversal middleware.
percent-encoding = "2"

# Async traits for middleware plumbing.
async-trait = "0.1"
futures-util = "0.3"

# Serde for discovery payload construction when sibling interop helpers
# are not feature-gated.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Tracing / logging.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error wiring.
anyhow = "1"

# HTTP client for the CORS proxy endpoint.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }

# URL parsing for proxy SSRF validation.
url = "2"

# The embedded docs tree now comes from the owning crate via the
# `embedded-docs` feature on solid-pod-rs (re-exporting include_dir), so
# registry builds of this crate stay self-contained — the previous direct
# include_dir!("../solid-pod-rs/docs") escaped the package root and broke
# `cargo publish` verification.

# Optional TLS (rustls). Gated by the `tls` feature so default builds
# keep the dependency surface minimal.
rustls = { version = "0.23", optional = true, default-features = false, features = ["std", "ring"] }
rustls-pemfile = { version = "2", optional = true }

# Optional git HTTP backend + auto-init (JSS #466/#469/#471).
# Gated by `git` feature; not compiled for wasm32. Requires the
# `git` binary + `git-http-backend` CGI on the server host.
solid-pod-rs-git = { version = "0.5.0-alpha.3", path = "../solid-pod-rs-git", optional = true }

[features]
# Feature umbrella toggles for the server binary.
default = []

# TLS via rustls (actix-web's `rustls-0_23` integration).
tls = ["dep:rustls", "dep:rustls-pemfile", "actix-web/rustls-0_23"]

# Forwarded Sprint-7 sibling features — pass-through to `solid-pod-rs`.
rate-limit = ["solid-pod-rs/rate-limit"]
quota = ["solid-pod-rs/quota"]
did-nostr = ["solid-pod-rs/did-nostr"]
security-primitives = ["solid-pod-rs/security-primitives"]

# JSS v0.0.190 Phase 1 port (issue #437) — scaffolds. Pass-through.
# Default-off; handlers are `todo!()` stubs. Parity rows 196, 197, 198.
provision-keys = [
    "solid-pod-rs/provision-keys",
    "solid-pod-rs-idp/provision-keys",
]
nip05-endpoint = ["solid-pod-rs/nip05-endpoint"]
export-jsonld = ["solid-pod-rs/export-jsonld"]

# Git HTTP smart-protocol backend + per-pod auto-init (JSS #466/#469/#471).
# Activates solid-pod-rs/git-auto-init (the trait + provision_pod_ext) and
# links solid-pod-rs-git for the CGI handler and GitAutoInit implementor.
git = ["dep:solid-pod-rs-git", "solid-pod-rs/git-auto-init"]

# `install` subcommand NIP-98 signing (JSS `src/cli/install.js`). Pulls
# the schnorr signer so `--nostr-privkey` can mint push tokens. The
# subcommand always compiles; without this feature only `--token`
# (bearer) auth works and `--nostr-privkey` returns an actionable error.
install = ["solid-pod-rs/nip98-schnorr"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
parking_lot = "0.12"
async-trait = "0.1"
# Pay-route integration tests mint NIP-98 tokens and derive the signer's
# did:nostr from the secret key (deterministic, no network).
hex = "0.4"
k256 = { version = "0.13", features = ["schnorr"] }
