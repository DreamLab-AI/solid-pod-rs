name: CI

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
  schedule:
    # Weekly cron for audit + scheduled-only jobs (Mondays 06:17 UTC)
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"
  RUST_BACKTRACE: 1
  # Consumed by the core-crate matrix (build-test/msrv/wasm-check); the
  # `workspace` job below deliberately runs at the repo root to cover every
  # workspace member.
  CRATE_DIR: crates/solid-pod-rs

jobs:
  # ---------------------------------------------------------------------------
  # Core build matrix: {ubuntu, macos} x {stable, beta} x {feature-sets}
  # beta is informational — it is allowed to fail without blocking the pipeline.
  # ---------------------------------------------------------------------------
  build-test:
    name: test (${{ matrix.os }} / ${{ matrix.toolchain }} / ${{ matrix.features.label }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.toolchain == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        toolchain: [stable, beta]
        features:
          - label: default
            flags: ""
          - label: oidc
            flags: "--no-default-features --features memory-backend,fs-backend,oidc"
          - label: all-features
            flags: "--all-features"
    defaults:
      run:
        working-directory: crates/solid-pod-rs
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain (${{ matrix.toolchain }})
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: crates/solid-pod-rs -> target
          key: ${{ matrix.os }}-${{ matrix.toolchain }}-${{ matrix.features.label }}

      - name: cargo fmt --check
        if: matrix.toolchain == 'stable' && matrix.features.label == 'default'
        run: cargo fmt --all -- --check

      - name: cargo check --all-targets ${{ matrix.features.flags }}
        run: cargo check --all-targets ${{ matrix.features.flags }}

      - name: cargo clippy --all-targets ${{ matrix.features.flags }} -- -D warnings
        run: cargo clippy --all-targets ${{ matrix.features.flags }} -- -D warnings

      - name: cargo test ${{ matrix.features.flags }}
        run: cargo test ${{ matrix.features.flags }} --all-targets

      - name: cargo doc --no-deps ${{ matrix.features.flags }}
        if: matrix.toolchain == 'stable'
        env:
          RUSTDOCFLAGS: "-D warnings -D rustdoc::broken-intra-doc-links"
        run: cargo doc --no-deps ${{ matrix.features.flags }}

  # ---------------------------------------------------------------------------
  # MSRV sanity check (pinned to clippy.toml msrv)
  # ---------------------------------------------------------------------------
  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/solid-pod-rs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: crates/solid-pod-rs -> target
          key: msrv-1.88
      - name: cargo check (default features)
        run: cargo check --all-targets

  # ---------------------------------------------------------------------------
  # WASM target: library must build for wasm32-unknown-unknown using the
  # `core` feature surface (pure-logic: WAC, WebID, LDP parsers, NIP-98,
  # interop types). `memory-backend` implies `tokio-runtime` which pulls
  # in mio — not supported on wasm32. `core` is the designed entry point
  # for Cloudflare Workers / wasm32 consumers (ADR-076/078).
  # ---------------------------------------------------------------------------
  wasm-check:
    name: wasm32-unknown-unknown (core)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/solid-pod-rs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: crates/solid-pod-rs -> target
          key: wasm32
      - name: cargo check --target wasm32-unknown-unknown --no-default-features --features core
        run: |
          cargo check \
            --target wasm32-unknown-unknown \
            --no-default-features \
            --features core \
            --lib

  # ---------------------------------------------------------------------------
  # cargo-deny: licence policy + advisories + bans + sources
  # ---------------------------------------------------------------------------
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/solid-pod-rs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: Cargo.toml
          log-level: warn
          command: check
          arguments: --all-features

  # ---------------------------------------------------------------------------
  # cargo-audit: RustSec advisory database
  # Runs on every push/PR and additionally on the weekly schedule.
  # ---------------------------------------------------------------------------
  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Runs at the repo root so the whole-workspace Cargo.lock (all 7 members'
      # transitive deps) is audited, not just the core crate's slice.
      - name: cargo audit
        run: cargo audit --deny warnings

  # ---------------------------------------------------------------------------
  # Coverage via cargo-tarpaulin (Linux only) -> Codecov
  # ---------------------------------------------------------------------------
  coverage:
    name: coverage (tarpaulin)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/solid-pod-rs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: crates/solid-pod-rs -> target
          key: coverage
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked
      - name: Run tarpaulin (all-features)
        run: |
          cargo tarpaulin \
            --all-features \
            --workspace \
            --timeout 300 \
            --fail-under 60 \
            --out Xml \
            --output-dir ./coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: crates/solid-pod-rs/coverage/cobertura.xml
          flags: solid-pod-rs
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # Workspace-wide build/lint/test — covers all eight workspace members, not just
  # the core crate. The core-crate matrix above exercises solid-pod-rs feature
  # combinations; this job guarantees the six sibling crates (server, idp,
  # activitypub, nostr, git, didkey) are compiled, linted and tested on every
  # PR/push. Runs at the repo root with default features (feature combos are
  # a per-crate concern handled by the matrix above).
  # ---------------------------------------------------------------------------
  workspace:
    name: workspace (test + clippy, all members)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: workspace-all-members
      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test --workspace --all-targets
        run: cargo test --workspace --all-targets

  # ---------------------------------------------------------------------------
  # RES-c diagram staleness guard — fails when a docs/diagrams/src/*.mmd is
  # newer than its rendered .svg/.png (or a render is missing). Pure git +
  # coreutils; no browser, so it needs neither the Chrome sidecar nor the
  # canon renderer at CI time. The verified re-render itself is gated by
  # VisionFlow's RES-b render gate; this job only guards freshness.
  # ---------------------------------------------------------------------------
  diagrams:
    name: diagrams (RES-c staleness guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # commit-time comparison needs full history
      - name: check diagram staleness
        run: bash scripts/check-diagram-staleness.sh

  # ---------------------------------------------------------------------------
  # Single required status check aggregator — branch protection points here.
  # ---------------------------------------------------------------------------
  ci-required:
    name: CI required
    runs-on: ubuntu-latest
    needs:
      - build-test
      - workspace
      - msrv
      - wasm-check
      - cargo-deny
      - cargo-audit
      - coverage
      - diagrams
    if: always()
    steps:
      - name: Verify dependent jobs succeeded
        run: |
          echo "build-test=${{ needs.build-test.result }}"
          echo "workspace=${{ needs.workspace.result }}"
          echo "msrv=${{ needs.msrv.result }}"
          echo "wasm-check=${{ needs.wasm-check.result }}"
          echo "cargo-deny=${{ needs.cargo-deny.result }}"
          echo "cargo-audit=${{ needs.cargo-audit.result }}"
          echo "coverage=${{ needs.coverage.result }}"
          echo "diagrams=${{ needs.diagrams.result }}"
          if [[ "${{ needs.build-test.result }}" != "success" ]] \
             || [[ "${{ needs.workspace.result }}" != "success" ]] \
             || [[ "${{ needs.msrv.result }}" != "success" ]] \
             || [[ "${{ needs.wasm-check.result }}" != "success" ]] \
             || [[ "${{ needs.cargo-deny.result }}" != "success" ]] \
             || [[ "${{ needs.cargo-audit.result }}" != "success" ]] \
             || [[ "${{ needs.coverage.result }}" != "success" ]] \
             || [[ "${{ needs.diagrams.result }}" != "success" ]]; then
            echo "One or more required jobs failed."
            exit 1
          fi
